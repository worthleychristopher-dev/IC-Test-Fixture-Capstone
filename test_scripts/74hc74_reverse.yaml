      1PRE,2PRE: [H, H]
      1CLR,2CLR: [H, H]
      1D,2D: [H, X]
      1CLK,2CLK: [R, L]
    Outputs:
      1Q,2Q: [H, H]
      1Qnot,2Qnot: [L, L]

  No Change -> L:
    Inputs:
      1PRE,2PRE: [H, H]
      1CLR,2CLR: [H, H]
      1D,2D: [L, X]
      1CLK,2CLK: [R, L]
