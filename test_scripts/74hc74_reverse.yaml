Truth Table:
  - {PRE: L, CLR: H, CLK: X, D: X, Q: H, Qnot: L}
  - {PRE: H, CLR: L, CLK: X, D: X, Q: L, Qnot: H}
  - {PRE: L, CLR: L, CLK: X, D: X, Q: H, Qnot: H}
  - {PRE: H, CLR: H, CLK: R, D: H, Q: H, Qnot: L}
  - {PRE: H, CLR: H, CLK: R, D: L, Q: L, Qnot: H}

Tests:
  D Flip-Flop 1:
    Inputs:
      1PRE: PRE
      1CLR: CLR
      1D: D
      1CLK: CLK
    Outputs:
      1Q: Q
      1Qnot: Qnot

  D Flip-Flop 2:
    Inputs:
      2PRE: PRE
      2CLR: CLR
      2D: D
      2CLK: CLK
    Outputs:
      2Q: Q
      2Qnot: Qnot

  No Change -> H:
