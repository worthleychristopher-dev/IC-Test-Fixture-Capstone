# Shift Register
Pin Map:
  SH/LD: 1
  CLK: 2
  E: 3
  F: 4
  G: 5
  H: 6
  QHnot: 7
  QH: 13
  SER: 14
  A: 15
  B: 16
  C: 17
  D: 18
  CLK INH: 19

Global Parameters:
  VCC Pin: 20
  GND Pin: 8
  VCC Voltage: 5
  Input Low: 0.8
  Input High: 2
  Output Low: 0.33
  Output High: 3.84

Tests:
  Parallel Load:
    Inputs:
      SH/LD: [L,H]
      SER: L
      CLK INH: [X, L]
      A,B,C,D,E,F,G,H: H,L,H,L,H,L,H,H
      CLK: [X, R]
    Outputs:
      QH: [H,H,L,H,L,H,L,H]
      QHnot: [L,L,H,L,H,L,H,L]

  Serial In 1:
    Inputs:
      SH/LD: [L,H]
      SER: [X,L,L,H,H,L,L,H,H]
      A,B,C,D,E,F,G,H: H,L,H,L,H,L,H,L
      CLK: [X, L]
      CLK INH: [X, R]
    Outputs:
      QH: [L,H,L,H,L,H,L,H,L,L,H,H,L,L,H,H]
      QHnot: [H,L,H,L,H,L,H,L,H,H,L,L,H,H,L,L]

  Serial In 2:
    Inputs:
      SH/LD: [L,H]
      SER: [X,L,L,H,H,L,L,H,H]
      A,B,C,D,E,F,G,H: H,L,H,L,H,L,H,L
      CLK: [X, R]
      CLK INH: [X, L]
    Outputs:
      QH: [L,H,L,H,L,H,L,H,L,L,H,H,L,L,H,H]
      QHnot: [H,L,H,L,H,L,H,L,H,H,L,L,H,H,L,L]
    
  No Change 1:
    Inputs:
      SH/LD: [L,H]
      SER: [X,L,H]
      A,B,C,D,E,F,G,H: H,L,H,L,H,L,H,L
      CLK: [X,L,L,L,L,L,L,L,L,H]
      CLK INH: [X,R,R,R,R,R,R,R,R,X]
    Outputs:
      QH: [L,H,L,H,L,H,L,H,L,L,L,L]
      QHnot: [H,L,H,L,H,L,H,L,H,H,H,H]
  
  No Change 2:
    Inputs:
      SH/LD: [L,H]
      SER: [X,L,H]
      A,B,C,D,E,F,G,H: H,L,H,L,H,L,H,L
      CLK: [X,L,L,L,L,L,L,L,L,X]
      CLK INH: [X,R,R,R,R,R,R,R,R,H]
    Outputs:
      QH: [L,H,L,H,L,H,L,H,L,L,L,L]
      QHnot: [H,L,H,L,H,L,H,L,H,H,H,H]