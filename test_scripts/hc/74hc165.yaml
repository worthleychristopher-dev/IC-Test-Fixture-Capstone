# Shift Register
Pin Map:
  SH/LD: 1
  CLK: 2
  E: 3
  F: 4
  G: 5
  H: 6
  QHnot: 7
  QH: 13
  SER: 14
  A: 15
  B: 16
  C: 17
  D: 18
  CLK INH: 19

Global Parameters:
  VCC Pin: 20
  GND Pin: 8
  VCC Voltage: [2.5, 3.3, 4.0, 4.5, 5]
  Input Low: [0.75, 0.99, 1.2, 1.35, 1.5]
  Input High: [1.75, 2.31, 2.8, 3.15, 3.5]
  Output Low: [0.3, 0.3, 0.3, 0.3, 0.3]
  Output High: [2.2, 3.0, 3.6, 4.1, 4.7]

Tests:
  Parallel Load:
    Inputs:
      SH/LD: [L,H]
      SER: L
      CLK INH: [X, L]
      A,B,C,D,E,F,G,H: H,L,H,L,H,L,H,H
      CLK: [X, R]
    Outputs:
      QH: [H,H,L,H,L,H,L,H]
      QHnot: [L,L,H,L,H,L,H,L]

  Serial In 1:
    Inputs:
      SH/LD: [L,H]
      SER: [X,L,L,H,H,L,L,H,H]
      A,B,C,D,E,F,G,H: H,L,H,L,H,L,H,L
      CLK: [X, L]
      CLK INH: [X, R]
    Outputs:
      QH: [L,H,L,H,L,H,L,H,L,L,H,H,L,L,H,H]
      QHnot: [H,L,H,L,H,L,H,L,H,H,L,L,H,H,L,L]

  Serial In 2:
    Inputs:
      SH/LD: [L,H]
      SER: [X,L,L,H,H,L,L,H,H]
      A,B,C,D,E,F,G,H: H,L,H,L,H,L,H,L
      CLK: [X, R]
      CLK INH: [X, L]
    Outputs:
      QH: [L,H,L,H,L,H,L,H,L,L,H,H,L,L,H,H]
      QHnot: [H,L,H,L,H,L,H,L,H,H,L,L,H,H,L,L]
    
  No Change 1:
    Inputs:
      SH/LD: [L,H]
      SER: [X,L,H]
      A,B,C,D,E,F,G,H: H,L,H,L,H,L,H,L
      CLK: [X,L,L,L,L,L,L,L,L,H]
      CLK INH: [X,R,R,R,R,R,R,R,R,X]
    Outputs:
      QH: [L,H,L,H,L,H,L,H,L,L,L,L]
      QHnot: [H,L,H,L,H,L,H,L,H,H,H,H]
  
  No Change 2:
    Inputs:
      SH/LD: [L,H]
      SER: [X,L,H]
      A,B,C,D,E,F,G,H: H,L,H,L,H,L,H,L
      CLK: [X,L,L,L,L,L,L,L,L,X]
      CLK INH: [X,R,R,R,R,R,R,R,R,H]
    Outputs:
      QH: [L,H,L,H,L,H,L,H,L,L,L,L]
      QHnot: [H,L,H,L,H,L,H,L,H,H,H,H]