# JK Flip-Flop
Global Parameters:
  VCC Pin: 4
  GND Pin: 17
  VCC Voltage: [2.5, 3.3, 4.5, 5]
  Input Low: [0.75, 0.99, 1.35, 1.5]
  Input High: [1.75, 2.31, 3.15, 3.5]
  Output Low: [0.1, 0.1, 0.1, 0.1]
  Output High: [2.4, 3.2, 4.4, 4.9]

Pin Map:
  1CP:    1
  1R:     2
  1K:     3
  2CP:    5
  2R:     6
  2J:     7
  2Qnot:  14
  2Q:     15
  2K:     16
  1Q:     18
  1Qnot:  19
  1J:     20

Truth Table:
  - {R: L, CP: X, J: X, K: X, Q: L, Qnot: H}
  - {R: H, CP: F, J: H, K: L, Q: H, Qnot: L}
  - {R: H, CP: F, J: L, K: H, Q: L, Qnot: H}

Tests:
  JK Flip-Flop 1:
    Inputs:
      1R: R
      1CP: CP
      1J: J
      1K: K
    Outputs:
      1Q: Q
      1Qnot: Qnot

  JK Flip-Flop 2:
    Inputs:
      2R: R
      2CP: CP
      2J: J
      2K: K
    Outputs:
      2Q: Q
      2Qnot: Qnot

  No Change 1 -> L:
  # set output to L initially, then check for no change
    Inputs: 
      1R,2R:  [L, H]
      1CP,2CP: [X, F]
      1J,2J: [X, L]
      1K,2K: [X, L]
    Outputs:
      1Q,2Q: [L, L]
      1Qnot,2Qnot: [H, H]
  
  No Change 1 -> H:
  # sets output to H initially, then check for no change
    Inputs: 
      1R,2R:  [H, H]
      1CP,2CP: [F, F]
      1J,2J: [H, L]
      1K,2K: [L, L]
    Outputs:
      1Q,2Q: [H, H]
      1Qnot,2Qnot: [L, L]

  No Change 2 -> L:
    Inputs: 
      1R,2R:  [L, H]
      1CP,2CP: [X, H]
      1J,2J: [X, X]
      1K,2K: [X, X]
    Outputs:
      1Q,2Q: [L, L]
      1Qnot,2Qnot: [H, H]

  No Change 2 -> H:
    Inputs: 
      1R,2R:  [H, H]
      1CP,2CP: [F, H]
      1J,2J: [H, X]
      1K,2K: [L, X]
    Outputs:
      1Q,2Q: [H, H]
      1Qnot,2Qnot: [L, L]

  No Change 2 -> H:
    Inputs: 
      1R,2R:  [H, H]
      1CP,2CP: [F, H]
      1J,2J: [H, X]
      1K,2K: [L, X]
    Outputs:
      1Q,2Q: [H, H]
      1Qnot,2Qnot: [L, L] 

  Toggle:
    Inputs: 
      1R,2R:  [L, F]
      1CP,2CP: [X, H]
      1J,2J: [X, H]
      1K,2K: [X, H]
    Outputs:
      1Q,2Q: [L, H, L]
      1Qnot,2Qnot: [H, L, H] 
