# 4-bit adder shortened
# tests every input and output bit for and edge cases
Pin Map:
  S1: 1
  B1: 2
  A1: 3
  S0: 4
  A0: 5
  B0: 6
  CIN: 7
  COUT: 13
  S3: 14
  B3: 15
  A3: 16
  S2: 17
  A2: 18
  B2: 19

Global Parameters:
  VCC Pin: 20
  GND Pin: 8
  VCC Voltage: [2.5, 3.3, 4.0, 4.5, 5]
  Input Low: [0.75, 0.99, 1.2, 1.35, 1.5]
  Input High: [1.75, 2.31, 2.8, 3.15, 3.5]
  Output Low: [0.3, 0.3, 0.3, 0.3, 0.3]
  Output High: [2.2, 3.0, 3.6, 4.1, 4.7]

Tests:
  # all 0s
  A=0, B=0, CIN=0 -> S=0:
    Inputs:
      A3,A2,A1,A0: 0
      B3,B2,B1,B0: 0
      CIN: 0
    Outputs:
      COUT,S3,S2,S1,S0: 0
  # only carry bit
  A=0, B=0, CIN=1 -> S=1:
    Inputs:
      A3,A2,A1,A0: 0
      B3,B2,B1,B0: 0
      CIN: 1
    Outputs:
      COUT,S3,S2,S1,S0: 1
  # only A
  A=1, B=0, CIN=0 -> S=1:
    Inputs:
      A3,A2,A1,A0: 1
      B3,B2,B1,B0: 0
      CIN: 0
    Outputs:
      COUT,S3,S2,S1,S0: 1
  # only B
  A=0, B=1, CIN=0 -> S=1:
    Inputs:
      A3,A2,A1,A0: 0
      B3,B2,B1,B0: 1
      CIN: 0
    Outputs:
      COUT,S3,S2,S1,S0: 1
  # simple sum, no carry
  A=3, B=5, CIN=0 -> S=8:
    Inputs:
      A3,A2,A1,A0: 3
      B3,B2,B1,B0: 5
      CIN: 0
    Outputs:
      COUT,S3,S2,S1,S0: 8
  # simple sum, overflow
  A=15, B=1, CIN=0 -> S=16:
    Inputs:
      A3,A2,A1,A0: 15
      B3,B2,B1,B0: 1
      CIN: 0
    Outputs:
      COUT,S3,S2,S1,S0: 16
  # simple sum, overflow 
  A=15, B=15, CIN=0 -> S=30:
    Inputs:
      A3,A2,A1,A0: 15
      B3,B2,B1,B0: 15
      CIN: 0
    Outputs:
      COUT,S3,S2,S1,S0: 30
  # overflow
  A=15, B=15, CIN=1 -> S=31:
    Inputs:
      A3,A2,A1,A0: 15
      B3,B2,B1,B0: 15
      CIN: 1
    Outputs:
      COUT,S3,S2,S1,S0: 31
  # alternating pattern
  A=10, B=5, CIN=0 -> S=15:
    Inputs:
      A3,A2,A1,A0: 10
      B3,B2,B1,B0: 5
      CIN: 0
    Outputs:
      COUT,S3,S2,S1,S0: 15
  # alternating + carry ripple
  A=10, B=10, CIN=1 -> S=21:
    Inputs:
      A3,A2,A1,A0: 10
      B3,B2,B1,B0: 10
      CIN: 1
    Outputs:
      COUT,S3,S2,S1,S0: 21
  # mid range ripple
  A=7, B=1, CIN=0 -> S=21:
    Inputs:
      A3,A2,A1,A0: 7
      B3,B2,B1,B0: 1
      CIN: 0
    Outputs:
      COUT,S3,S2,S1,S0: 8
  # mixed stress case
  A=7, B=3, CIN=1 -> S=21:
    Inputs:
      A3,A2,A1,A0: 12
      B3,B2,B1,B0: 3
      CIN: 1
    Outputs:
      COUT,S3,S2,S1,S0: 16